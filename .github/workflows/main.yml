name: Make space video

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate video
        run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          retention-days: 14
      - name: Save progress
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add done.txt
          git commit -m "done script" || echo "nothing"
          git push
